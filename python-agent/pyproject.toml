[project]
name = "jobpilot-agent"
version = "0.1.0"
description = "JobPilot Agent Python AI service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
    "pymilvus>=2.4",
    "chromadb>=0.5",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "sentence-transformers>=2.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]
eval = [
    "ragas>=0.2",
    "datasets>=2.18",
]
crawl = [
    "playwright>=1.42",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 集成测试，需要外部服务（Milvus 等），默认不运行，用 -m integration 启用",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "src"
