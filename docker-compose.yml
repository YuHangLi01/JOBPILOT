version: "3.9"

# JobPilot 本地基础设施 + 一次性灌库 Job。
#
# 日常：
#   docker compose up -d milvus
# 灌库：
#   docker compose --profile ingest up --build kb-ingester
#
# 为保持最小可用集合，暂不把 python-agent / nodejs-gateway 放进来；这两个服务
# 分别用 `make dev-py` / `make dev-node` 本地跑，等到后续任务再统一编排。

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: jobpilot-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: jobpilot-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.5
    container_name: jobpilot-milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # web UI (v2.4+ standalone)
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jobpilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 一次性灌库 Job：`docker compose --profile ingest up --build kb-ingester`
  kb-ingester:
    build:
      context: .
      dockerfile: knowledge-base/Dockerfile
    container_name: jobpilot-kb-ingester
    profiles: ["ingest"]
    depends_on:
      milvus:
        condition: service_healthy
    environment:
      - MILVUS_URI=http://milvus:19530
      - EMBEDDING_PROVIDER=local
      - HF_ENDPOINT=https://hf-mirror.com
      - LLM_API_KEY=placeholder-not-used-during-ingest
      - RETRIEVAL_FALLBACK_TO_CHROMA=false
    volumes:
      - ./knowledge-base/data:/app/data
      - hf_cache:/root/.cache/huggingface
    command: ["rebuild-all"]
    working_dir: /app

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  hf_cache:
